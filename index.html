<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>VO Recorder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VO Recorder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111a19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: quiet top bar, script card fills the middle, square takes scroll sideways, record dock at the bottom. */
  --bg: #edf1ef;
  --bg-deep: #e3eae7;
  --surface: #fbfcfb;
  --ink: #1d2b2a;
  --muted: #677876;
  --line: #d8e1de;
  --soft: #e6eeeb;
  --accent: #2e6e68;
  --on-accent: #ffffff;
  --rec: #e2685f;
  --tile-l: 87%;
  --tile-s: 28%;
  --bar-l: 38%;
  --shadow: 0 1px 2px rgba(29, 43, 42, 0.05), 0 10px 28px rgba(29, 43, 42, 0.07);
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --read: "Literata", Georgia, "Times New Roman", serif;
  --script-size: 19px;
  --dock-h: 150px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111a19;
    --bg-deep: #0c1312;
    --surface: #182322;
    --ink: #e4edeb;
    --muted: #8ea29f;
    --line: #273634;
    --soft: #1e2b29;
    --accent: #7cc6bb;
    --on-accent: #0b2622;
    --rec: #ff7b71;
    --tile-l: 21%;
    --tile-s: 18%;
    --bar-l: 72%;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  color: var(--ink);
  font: 400 1rem/1.45 var(--ui);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 3px; }
button:disabled { cursor: default; }
.wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 18px; }
.label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
svg { display: block; }

/* Top bar */
.top { flex: none; padding: calc(14px + env(safe-area-inset-top, 0px)) 0 4px; }
.top .wrap { display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.0625rem; letter-spacing: -0.01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
.brand-mark i { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 0 2.5px var(--on-accent); }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.status:has(#status:empty):has(#statusBtn[hidden]) { display: none; }
#status { margin: 0; font-size: 0.875rem; color: var(--muted); }
#statusBtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 0.875rem; font-weight: 600; }

/* Script card */
.script { flex: 1 1 auto; min-height: 160px; display: flex; padding: 10px 0 12px; }
.script .wrap { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.script-head { display: flex; align-items: center; justify-content: space-between; min-height: 30px; }
.hint { font-size: 0.8125rem; color: var(--muted); }
.hint[hidden] { display: none; }
#done { border: none; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 6px 18px; font-weight: 600; font-size: 0.9375rem; }
#done[hidden] { display: none; }
.box {
  position: relative;
  flex: 1;
  min-height: 0;
  border: 1.5px solid var(--line);
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow);
  font-size: var(--script-size);
  transition: border-color 0.2s ease;
}
.box:focus-within { border-color: var(--accent); }
#ta {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  margin: 0; border: none; outline: none; resize: none;
  background: transparent; color: var(--ink);
  padding: 20px 22px 48px;
  font-family: var(--read); font-size: inherit; line-height: 1.7;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  border-radius: 22px;
  caret-color: var(--accent);
}
#ta::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }
/* Blinking cursor in the empty card before it is tapped */
.box.empty:not(:focus-within)::after {
  content: "";
  position: absolute;
  left: 23px;
  top: calc(20px + 0.2em);
  width: 2px;
  height: 1.3em;
  border-radius: 1px;
  background: var(--accent);
  animation: blink 1.1s steps(1) infinite;
  pointer-events: none;
}
@keyframes blink { 50% { opacity: 0; } }
.size-pill {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  background: var(--ink); color: var(--surface);
  font: 600 0.8125rem/1 var(--ui); font-variant-numeric: tabular-nums;
  padding: 8px 14px; border-radius: 999px;
  pointer-events: none;
  opacity: 0; transition: opacity 0.2s ease;
}
.size-pill.show { opacity: 0.92; }

/* Takes strip */
.strip { flex: none; padding: 2px 0 12px; }
.strip-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
#total { font-size: 0.8125rem; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.strip-meta { display: flex; align-items: center; gap: 10px; }
.gap-btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 4px 11px;
  font-size: 0.8125rem; font-weight: 600; font-variant-numeric: tabular-nums;
}
.gap-btn:active { background: var(--soft); }
#clips {
  list-style: none; margin: 0;
  display: flex; gap: 10px;
  overflow-x: auto; overflow-y: hidden;
  overscroll-behavior-x: contain;
  scroll-snap-type: x proximity;
  scroll-padding: 0 18px;
  padding: 2px 18px 6px;
  scrollbar-width: none;
}
#clips::-webkit-scrollbar { display: none; }
.strip-scroll { max-width: 640px; margin: 0 auto; }

.tile {
  --h: 168;
  position: relative;
  flex: none;
  width: 104px;
  aspect-ratio: 1;
  border-radius: 20px;
  background: hsl(var(--h) var(--tile-s) var(--tile-l));
  scroll-snap-align: start;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 6%, transparent);
  transition: transform 0.15s ease, box-shadow 0.2s ease;
}
.tile.playing { box-shadow: inset 0 0 0 2px var(--accent); }
.tile.fresh { animation: pop 0.35s ease-out; }
@keyframes pop { from { transform: scale(0.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.tile-main {
  position: absolute; inset: 0;
  border: none; padding: 0; background: transparent;
  border-radius: inherit;
  display: block;
}
.tile-main:active { transform: scale(0.97); }
.tile-num { position: absolute; left: 11px; top: 9px; font-size: 0.8125rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; color: hsl(var(--h) 30% var(--bar-l)); }
.tile-dur { position: absolute; left: 11px; top: 26px; font-size: 0.75rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; color: var(--ink); opacity: 0.8; }
.tile-wave { position: absolute; left: 11px; right: 11px; top: 46px; height: 22px; display: flex; align-items: center; gap: 2px; }
.tile-wave i { flex: 1; border-radius: 2px; background: hsl(var(--h) 30% var(--bar-l) / 0.45); }
.tile-wave i.on { background: var(--accent); }
.tile-play {
  position: absolute; left: 8px; bottom: 7px;
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface); color: var(--accent);
}
.tile-play svg { width: 12px; height: 12px; }
.tile-x, .tile-save {
  position: absolute;
  width: 32px; height: 32px; border-radius: 50%;
  border: none; padding: 0;
  display: grid; place-items: center;
  background: transparent;
}
.tile-x { right: 3px; top: 3px; color: var(--rec); }
.tile-x span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); }
.tile-x svg { width: 11px; height: 11px; }
.tile-save { right: 4px; bottom: 4px; color: hsl(var(--h) 30% var(--bar-l)); }
.tile-save svg { width: 16px; height: 16px; }
.tile-ghost {
  flex: none; width: 104px; aspect-ratio: 1; border-radius: 20px;
  border: 1.5px dashed var(--line);
  display: grid; place-items: center; color: var(--muted);
}
.tile-ghost svg { width: 22px; height: 22px; opacity: 0.7; }
.ghost-text { flex: none; align-self: center; max-width: 190px; margin: 0; font-size: 0.875rem; color: var(--muted); }

/* Record dock */
.dock {
  flex: none;
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -1px 0 var(--line), 0 -10px 30px rgba(29, 43, 42, 0.06);
  padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px));
}
.dock .wrap { display: flex; flex-direction: column; gap: 10px; }
.dock-top { display: flex; align-items: center; gap: 12px; }
#timer { flex: none; min-width: 5.6ch; font: 600 1.375rem/1 var(--ui); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; color: var(--muted); }
#timer.on { color: var(--rec); }
#meter { flex: 1; min-width: 0; height: 30px; display: block; }
.dock-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.side-btn {
  justify-self: center;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  border: none; background: transparent; padding: 4px 8px;
  font-size: 0.75rem; font-weight: 600; color: var(--muted);
}
.side-icon {
  position: relative;
  width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--soft); color: var(--ink);
  transition: background 0.2s ease, color 0.2s ease;
}
.side-icon svg { width: 21px; height: 21px; }
.side-btn.join:not(:disabled) .side-icon { background: var(--accent); color: var(--on-accent); }
.side-btn.join:not(:disabled) { color: var(--ink); }
.side-btn:disabled { opacity: 0.45; }
#badge {
  position: absolute; top: -3px; right: -5px;
  min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 10px;
  background: var(--rec); color: #fff;
  font: 700 0.6875rem/20px var(--ui);
  text-align: center;
  box-shadow: 0 0 0 2px var(--surface);
}
#badge[hidden] { display: none; }
.rec {
  width: 76px; height: 76px;
  border-radius: 50%;
  border: 3px solid color-mix(in srgb, var(--rec) 35%, var(--line));
  background: var(--surface);
  display: grid; place-items: center;
  padding: 0;
  transition: border-color 0.2s ease;
}
.rec span { width: 56px; height: 56px; border-radius: 50%; background: var(--rec); transition: all 0.2s ease; }
.rec.on { border-color: var(--rec); animation: halo 1.6s ease-out infinite; }
.rec.on span { width: 26px; height: 26px; border-radius: 7px; }
.rec.busy { opacity: 0.5; }
@keyframes halo {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rec) 35%, transparent); }
  100% { box-shadow: 0 0 0 18px transparent; }
}

/* Toast */
#toast {
  position: fixed;
  left: 18px; right: 18px;
  bottom: calc(var(--dock-h) + 12px);
  margin: 0 auto; max-width: 380px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--ink); color: var(--surface);
  border-radius: 16px; padding: 8px 8px 8px 16px; font-size: 0.9375rem;
  box-shadow: var(--shadow);
}
#toast[hidden] { display: none; }
#toastText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#undo { flex: none; border: none; border-radius: 10px; padding: 8px 14px; font-weight: 700; background: var(--surface); color: var(--ink); }

/* New-session sheet */
.backdrop {
  position: fixed; inset: 0;
  background: color-mix(in srgb, var(--bg-deep) 55%, rgba(0, 0, 0, 0.35));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 10;
}
.backdrop[hidden] { display: none; }
.sheet {
  width: 100%; max-width: 520px;
  background: var(--surface);
  border-radius: 28px 28px 0 0;
  padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
  box-shadow: var(--shadow);
  animation: rise 0.25s ease-out;
}
@keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 16px; }
.sheet h2 { margin: 0 0 6px; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sheet p { margin: 0 0 18px; color: var(--muted); font-size: 0.9375rem; }
.sheet-actions { display: flex; flex-direction: column; gap: 10px; }
.sheet-actions button { border: none; border-radius: 16px; padding: 14px 16px; font-weight: 600; font-size: 1rem; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-quiet { background: var(--soft); color: var(--ink); }
.btn-danger { background: color-mix(in srgb, var(--rec) 14%, var(--surface)); color: var(--rec); }
.sheet-actions button[hidden] { display: none; }

/* While typing, the script gets the whole screen */
body.editing .top,
body.editing .strip,
body.editing .dock,
body.editing #toast { display: none; }
body.editing .script { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }

@media (prefers-reduced-motion: reduce) {
  .rec.on { animation: none; }
  .rec span, .box, .tile { transition: none; }
  .tile.fresh, .sheet { animation: none; }
  .box.empty:not(:focus-within)::after { animation: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><span class="brand-mark"><i></i></span>VO Recorder</div>
    <div class="status">
      <p id="status" role="status" aria-live="polite"></p>
      <button id="statusBtn" type="button" hidden>Use phone recorder instead</button>
    </div>
  </div>
</header>

<section class="script">
  <div class="wrap">
    <div class="script-head">
      <span class="label">Script</span>
      <span class="hint" id="hint" hidden>Pinch to resize text</span>
      <button id="done" type="button" hidden>Done</button>
    </div>
    <div class="box empty" id="box">
      <textarea id="ta" aria-label="Script" enterkeyhint="done" spellcheck="false" autocomplete="off" autocapitalize="sentences"></textarea>
      <div class="size-pill" id="sizePill" aria-hidden="true">Text 19</div>
    </div>
  </div>
</section>

<section class="strip" aria-label="Recorded takes">
  <div class="wrap">
    <div class="strip-head">
      <span class="label">Takes</span>
      <div class="strip-meta">
        <span id="total"></span>
        <button id="gapBtn" class="gap-btn" type="button" aria-label="Pause between takes when joined: 0.5 seconds. Tap to change.">Gap 0.5 s</button>
      </div>
    </div>
  </div>
  <div class="strip-scroll">
    <ol id="clips"></ol>
  </div>
</section>

<footer class="dock" id="dock">
  <div class="wrap">
    <div class="dock-top">
      <output id="timer" aria-label="Recording time">00:00.0</output>
      <canvas id="meter" aria-hidden="true"></canvas>
    </div>
    <div class="dock-row">
      <button id="newBtn" class="side-btn" type="button" aria-label="Start a new recording">
        <span class="side-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></span>
        New
      </button>
      <button id="rec" class="rec" type="button" aria-label="Start recording"><span></span></button>
      <button id="join" class="side-btn join" type="button" disabled>
        <span class="side-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span id="badge" hidden>0</span></span>
        Join all
      </button>
    </div>
  </div>
</footer>

<div id="toast" hidden>
  <span id="toastText"></span>
  <button id="undo" type="button">Undo</button>
</div>

<div class="backdrop" id="sheetBack" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-describedby="sheetText">
    <div class="grabber" aria-hidden="true"></div>
    <h2 id="sheetTitle">Start a new recording?</h2>
    <p id="sheetText"></p>
    <div class="sheet-actions">
      <button id="keepBtn" class="btn-primary" type="button">Keep script, clear takes</button>
      <button id="clearBtn" class="btn-danger" type="button">Clear script and takes</button>
      <button id="cancelBtn" class="btn-quiet" type="button">Cancel</button>
    </div>
  </div>
</div>

<input type="file" id="capture" accept="audio/*" capture hidden>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const el = {
    meter: $('meter'), timer: $('timer'), rec: $('rec'),
    status: $('status'), statusBtn: $('statusBtn'),
    list: $('clips'), total: $('total'), gapBtn: $('gapBtn'),
    join: $('join'), badge: $('badge'), newBtn: $('newBtn'), dock: $('dock'),
    toast: $('toast'), toastText: $('toastText'), undo: $('undo'), capture: $('capture'),
    ta: $('ta'), box: $('box'), done: $('done'), hint: $('hint'), sizePill: $('sizePill'),
    sheetBack: $('sheetBack'), sheetText: $('sheetText'),
    keepBtn: $('keepBtn'), clearBtn: $('clearBtn'), cancelBtn: $('cancelBtn'),
  };

  const BARS = 22;
  const HUES = [168, 192, 150, 205, 178, 140];
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const HEAD_PAD = 0.08;               // seconds of quiet kept before the voice starts
  const TAIL_PAD = 0.2;                // seconds kept after it stops, so word endings ring out
  const GAPS = [0.25, 0.5, 0.75, 1, 1.5];
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
    save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>',
    cut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  };

  let mode = 'mic';
  let ctx = null, stream = null, analyser = null, levelData = null;
  let recorder = null, chunks = [];
  let recording = false, busy = false, recStart = 0;
  let wake = null;
  const clips = [];
  let nextId = 1, hueIndex = 0, unsaved = false, freshId = null;
  let gapSeconds = 0.5;
  try { const g = parseFloat(localStorage.getItem('vo-gap')); if (GAPS.includes(g)) gapSeconds = g; } catch (err) {}
  const player = new Audio();
  let playingId = null;
  let trash = null, trashTimer = 0;

  /* ---------- helpers ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const clock = (s) => pad(Math.floor(s / 60)) + ':' + pad(Math.floor(s % 60));
  const clockTenths = (s) => clock(s) + '.' + Math.floor((s * 10) % 10);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function setStatus(text, offerPhone) {
    el.status.textContent = text || '';
    el.statusBtn.hidden = !offerPhone;
  }

  function audioCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function decode(buffer) {
    return new Promise((resolve, reject) => audioCtx().decodeAudioData(buffer, resolve, reject));
  }

  function toPcm16(audio) {
    const n = audio.length, chs = audio.numberOfChannels;
    const data = [];
    for (let c = 0; c < chs; c++) data.push(audio.getChannelData(c));
    const out = new Int16Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0;
      for (let c = 0; c < chs; c++) s += data[c][i];
      s = Math.max(-1, Math.min(1, s / chs));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  function wavHeader(bytes, rate) {
    const b = new ArrayBuffer(44), v = new DataView(b);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + bytes, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, bytes, true);
    return b;
  }

  // Cut the dead air before the voice starts and after it ends.
  // Works on 10 ms windows: the threshold sits a little above the room's noise floor.
  function trimSilence(pcm, rate) {
    const win = Math.max(1, Math.round(rate * 0.01));
    const count = Math.floor(pcm.length / win);
    if (count < 10) return pcm;
    const rms = new Float32Array(count);
    for (let w = 0; w < count; w++) {
      let sum = 0;
      for (let i = w * win, end = i + win; i < end; i++) { const v = pcm[i] / 32768; sum += v * v; }
      rms[w] = Math.sqrt(sum / win);
    }
    const sorted = Array.from(rms).sort((a, b) => a - b);
    const floor = sorted[Math.floor(count * 0.1)];
    const peak = sorted[count - 1];
    if (peak < 0.01) return pcm;                       // nothing that sounds like a voice
    const thr = Math.min(Math.max(floor * 3, 0.004), peak * 0.15);
    const loud = (w) => rms[w] > thr && rms[w + 1] > thr && rms[w + 2] > thr;
    let first = -1, last = -1;
    for (let w = 0; w < count - 2; w++) if (loud(w)) { first = w; break; }
    for (let w = count - 3; w >= 0; w--) if (loud(w)) { last = w + 2; break; }
    if (first < 0) return pcm;
    const start = Math.max(0, first * win - Math.round(HEAD_PAD * rate));
    const end = Math.min(pcm.length, (last + 1) * win + Math.round(TAIL_PAD * rate));
    if (start === 0 && end === pcm.length) return pcm;
    const out = pcm.slice(start, end);
    // Short fades so the cut edges never click
    const fade = Math.min(Math.round(rate * 0.012), Math.floor(out.length / 4));
    for (let i = 0; i < fade; i++) {
      const g = i / fade;
      if (start > 0) out[i] = Math.round(out[i] * g);
      if (end < pcm.length) out[out.length - 1 - i] = Math.round(out[out.length - 1 - i] * g);
    }
    return out;
  }

  function peaksOf(pcm) {
    const out = new Array(BARS).fill(0);
    const size = Math.max(1, Math.floor(pcm.length / BARS));
    let top = 1;
    for (let b = 0; b < BARS; b++) {
      let m = 0;
      const end = Math.min(pcm.length, (b + 1) * size);
      for (let i = b * size; i < end; i += 4) { const v = Math.abs(pcm[i]); if (v > m) m = v; }
      out[b] = m; if (m > top) top = m;
    }
    return out.map((v) => Math.max(0.12, v / top));
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = () => reject(r.error);
      r.readAsDataURL(blob);
    });
  }

  // Returns true when the file was handed off for saving
  async function saveBlob(blob, name) {
    if (window.AndroidSaver) {
      // Inside the Android app: stream the file to Downloads/VO Recorder
      setStatus('Saving ' + name + '…');
      const id = window.AndroidSaver.begin(name, blob.type || 'audio/wav');
      if (!id) { setStatus('Could not save the file. Check that your phone has free space.'); return false; }
      const CHUNK = 3 * 256 * 1024;
      try {
        for (let off = 0; off < blob.size; off += CHUNK) {
          const ok = window.AndroidSaver.append(id, await blobToBase64(blob.slice(off, off + CHUNK)));
          if (!ok) throw new Error('write failed');
        }
        const where = window.AndroidSaver.finish(id);
        setStatus(where ? 'Saved to ' + where : 'Could not save the file. Please try again.');
        return !!where;
      } catch (err) {
        window.AndroidSaver.finish(id);
        setStatus('Could not save the file. Please try again.');
        return false;
      }
    }
    if (IS_IOS && navigator.canShare && window.File) {
      // On iPhone: open the share sheet, where "Save to Files" or any editing app can take the file
      const file = new File([blob], name, { type: blob.type || 'audio/wav' });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
          setStatus('Shared ' + name + '.');
          return true;
        } catch (err) {
          if (err && err.name === 'AbortError') return false;
        }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return true;
  }

  /* ---------- recording ---------- */
  const micPossible = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

  function setMode(m) {
    mode = m;
    if (m === 'phone') setStatus("The red button now opens your phone's recorder. Record there, then tap Done or Save and the take comes back here.");
  }

  async function ensureStream() {
    if (stream && stream.active) return;
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true },
    });
    const c = audioCtx();
    analyser = c.createAnalyser();
    analyser.fftSize = 1024;
    levelData = new Float32Array(analyser.fftSize);
    c.createMediaStreamSource(stream).connect(analyser);
  }

  function releaseStream() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null; analyser = null;
  }

  async function onRecTap() {
    if (busy) return;
    if (document.activeElement === el.ta) el.ta.blur();
    if (recording) { stopRecording(); return; }
    stopPlayback();
    if (mode === 'phone') { el.capture.value = ''; el.capture.click(); return; }
    audioCtx();   // iPhone only lets audio start from a tap, so wake it up now
    busy = true;
    try {
      await ensureStream();
    } catch (err) {
      busy = false;
      const name = err && err.name;
      if (name === 'NotFoundError') setStatus('No microphone was found on this device.', true);
      else setStatus('The microphone is blocked. Allow it when asked, or use your phone recorder.', true);
      return;
    }
    busy = false;
    startRecording();
  }

  function startRecording() {
    const prefs = IS_IOS ? ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'] : ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    const type = prefs.find((t) => MediaRecorder.isTypeSupported(t));
    try {
      recorder = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 192000 } : undefined);
    } catch (err) {
      setStatus('Recording could not start here.', true);
      return;
    }
    chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => addClip(new Blob(chunks, { type: recorder.mimeType || 'audio/webm' }));
    recorder.start();
    recording = true;
    el.ta.readOnly = true;   // taps on the script won't pop up the keyboard mid-take
    recStart = performance.now();
    el.rec.classList.add('on');
    el.rec.setAttribute('aria-label', 'Stop recording');
    el.timer.classList.add('on');
    el.newBtn.disabled = true;
    setStatus('');
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then((w) => { wake = w; }).catch(() => {});
  }

  function stopRecording() {
    recording = false;
    busy = true;
    el.rec.classList.remove('on');
    el.rec.classList.add('busy');
    el.rec.setAttribute('aria-label', 'Start recording');
    el.timer.classList.remove('on');
    try { recorder.stop(); } catch (err) { finishBusy(); }
    if (wake) { wake.release().catch(() => {}); wake = null; }
  }

  function finishBusy() {
    busy = false;
    el.ta.readOnly = false;
    el.newBtn.disabled = false;
    el.rec.classList.remove('busy');
    el.timer.textContent = '00:00.0';
  }

  async function addClip(blob) {
    busy = true;
    el.rec.classList.add('busy');
    try {
      const audio = await decode(await blob.arrayBuffer());
      if (audio.duration < 0.3) {
        setStatus('That one was too short to keep.');
      } else {
        const raw = toPcm16(audio);
        const pcm = trimSilence(raw, audio.sampleRate);
        const wav = new Blob([wavHeader(pcm.byteLength, audio.sampleRate), pcm.buffer], { type: 'audio/wav' });
        const clip = {
          id: nextId++, blob: wav, url: URL.createObjectURL(wav),
          rate: audio.sampleRate, dur: pcm.length / audio.sampleRate, peaks: peaksOf(pcm),
          cut: (raw.length - pcm.length) / audio.sampleRate,
          hue: HUES[hueIndex++ % HUES.length],
        };
        clips.push(clip);
        unsaved = true;
        freshId = clip.id;
        setStatus(clip.cut >= 0.1
          ? 'Take ' + clips.length + ': trimmed ' + clip.cut.toFixed(1) + ' s of silence.'
          : (mode === 'mic' ? '' : el.status.textContent));
        render();
        el.list.scrollTo({ left: el.list.scrollWidth, behavior: 'smooth' });
      }
    } catch (err) {
      setStatus(mode === 'phone'
        ? "That recording could not be read. In your recorder app's settings, choose M4A, MP3 or WAV and try again."
        : 'That take could not be saved. Please record it again.');
    }
    finishBusy();
  }

  /* ---------- takes strip ---------- */
  function render() {
    el.list.innerHTML = '';
    if (!clips.length) {
      el.list.innerHTML =
        '<li class="tile-ghost" aria-hidden="true">' + ICON.mic + '</li>' +
        '<li class="ghost-text">Each take lands here as a square. Tap ✕ to drop one.</li>';
    }
    clips.forEach((c, i) => {
      const n = i + 1;
      const li = document.createElement('li');
      li.className = 'tile' + (c.id === freshId ? ' fresh' : '');
      li.dataset.id = c.id;
      li.style.setProperty('--h', c.hue);
      li.innerHTML =
        '<button class="tile-main" type="button" data-act="play" aria-label="Play take ' + n + ', ' + clock(c.dur) + '">' +
          '<span class="tile-num">' + pad(n) + '</span>' +
          '<span class="tile-dur">' + Math.floor(c.dur / 60) + ':' + pad(Math.floor(c.dur % 60)) + '</span>' +
          '<span class="tile-wave">' + c.peaks.map((p) => '<i style="height:' + Math.round(p * 100) + '%"></i>').join('') + '</span>' +
          '<span class="tile-play">' + ICON.play + '</span>' +
        '</button>' +
        '<button class="tile-save" type="button" data-act="save" aria-label="Download take ' + n + '">' + ICON.save + '</button>' +
        '<button class="tile-x" type="button" data-act="cut" aria-label="Discard take ' + n + '"><span>' + ICON.cut + '</span></button>';
      el.list.appendChild(li);
    });
    freshId = null;
    const has = clips.length > 0;
    const sum = joinedSeconds();
    el.total.textContent = has ? clips.length + (clips.length === 1 ? ' take · ' : ' takes · ') + clock(sum) : '';
    el.join.disabled = !has;
    el.badge.hidden = !has;
    el.badge.textContent = clips.length;
    el.join.setAttribute('aria-label', has
      ? 'Join all ' + clips.length + ' takes (' + clock(sum) + ') and download'
      : 'Join all: record a take first');
    syncPlayer();
  }

  function clipById(id) { return clips.find((c) => c.id === id); }

  el.list.addEventListener('click', (e) => {
    const target = e.target.closest('[data-act]');
    if (!target) return;
    const li = target.closest('.tile');
    const clip = li && clipById(Number(li.dataset.id));
    if (!clip) return;
    const act = target.dataset.act;
    if (act === 'play') togglePlay(clip);
    else if (act === 'save') saveBlob(clip.blob, 'take-' + (clips.indexOf(clip) + 1) + '.wav');
    else if (act === 'cut') discard(clip);
  });

  /* ---------- playback ---------- */
  function togglePlay(clip) {
    if (recording) return;
    if (playingId === clip.id) {
      if (player.paused) player.play().catch(() => {}); else player.pause();
    } else {
      player.src = clip.url;
      playingId = clip.id;
      player.play().catch(() => {});
    }
  }

  function stopPlayback() {
    if (playingId !== null) { player.pause(); playingId = null; syncPlayer(); }
  }

  function syncPlayer() {
    el.list.querySelectorAll('.tile').forEach((li) => {
      const mine = Number(li.dataset.id) === playingId;
      li.classList.toggle('playing', mine);
      li.querySelector('.tile-play').innerHTML = mine && !player.paused ? ICON.pause : ICON.play;
      if (!mine) li.querySelectorAll('.tile-wave i.on').forEach((b) => b.classList.remove('on'));
    });
    paintProgress();
  }

  function paintProgress() {
    if (playingId === null) return;
    const clip = clipById(playingId);
    const li = el.list.querySelector('[data-id="' + playingId + '"]');
    if (!clip || !li) return;
    const upTo = Math.round((player.currentTime / clip.dur) * BARS);
    const bars = li.querySelectorAll('.tile-wave i');
    for (let i = 0; i < bars.length; i++) bars[i].classList.toggle('on', i < upTo);
  }

  player.addEventListener('play', syncPlayer);
  player.addEventListener('pause', syncPlayer);
  player.addEventListener('ended', () => { playingId = null; syncPlayer(); });

  /* ---------- discard and undo ---------- */
  function emptyTrash() {
    clearTimeout(trashTimer);
    if (trash) { URL.revokeObjectURL(trash.clip.url); trash = null; }
    el.toast.hidden = true;
  }

  function discard(clip) {
    if (playingId === clip.id) stopPlayback();
    emptyTrash();
    const index = clips.indexOf(clip);
    clips.splice(index, 1);
    trash = { clip, index };
    el.toastText.textContent = 'Take ' + (index + 1) + ' discarded';
    el.toast.hidden = false;
    trashTimer = setTimeout(emptyTrash, 6000);
    render();
  }

  el.undo.addEventListener('click', () => {
    if (!trash) return;
    clearTimeout(trashTimer);
    clips.splice(Math.min(trash.index, clips.length), 0, trash.clip);
    trash = null;
    el.toast.hidden = true;
    render();
  });

  /* ---------- export ---------- */
  // The same pause between every take: the trimmed edges already hold HEAD_PAD + TAIL_PAD of quiet
  const insertSeconds = () => Math.max(0, gapSeconds - HEAD_PAD - TAIL_PAD);
  const joinedSeconds = () => clips.reduce((s, c) => s + c.dur, 0) + Math.max(0, clips.length - 1) * insertSeconds();

  el.join.addEventListener('click', async () => {
    if (!clips.length) return;
    const rate = clips[0].rate;
    const silence = new Int16Array(Math.round(insertSeconds() * rate));
    const parts = [];
    let bytes = 0;
    clips.forEach((c, i) => {
      if (i > 0 && silence.length) { parts.push(silence.buffer.slice(0)); bytes += silence.byteLength; }
      parts.push(c.blob.slice(44));
      bytes += c.blob.size - 44;
    });
    parts.unshift(wavHeader(bytes, rate));
    const d = new Date();
    const stamp = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());
    if (await saveBlob(new Blob(parts, { type: 'audio/wav' }), 'voice-over-' + stamp + '.wav')) unsaved = false;
  });

  function showGap() {
    const label = String(gapSeconds).replace(/^0\./, '0.');
    el.gapBtn.textContent = 'Gap ' + label + ' s';
    el.gapBtn.setAttribute('aria-label', 'Pause between takes when joined: ' + label + ' seconds. Tap to change.');
  }
  el.gapBtn.addEventListener('click', () => {
    gapSeconds = GAPS[(GAPS.indexOf(gapSeconds) + 1) % GAPS.length];
    try { localStorage.setItem('vo-gap', String(gapSeconds)); } catch (err) {}
    showGap();
    render();
    setStatus('Join all will leave ' + gapSeconds + ' s between takes.');
  });
  showGap();

  /* ---------- new recording ---------- */
  let sheetReturn = null;

  function openSheet() {
    if (recording || busy) return;
    const hasScript = el.ta.value.trim().length > 0;
    if (!clips.length && !hasScript) { setStatus('Already a fresh start. Paste a script or tap record.'); return; }
    const sum = clips.reduce((s, c) => s + c.dur, 0);
    let text;
    if (clips.length) {
      text = (clips.length === 1 ? 'Your 1 take (' : 'All ' + clips.length + ' takes (') + clock(sum) + ') will be removed.';
      if (unsaved) text += " You haven't downloaded them with Join all yet.";
    } else {
      text = 'There are no takes yet. Do you want to clear the script?';
    }
    el.sheetText.textContent = text;
    el.keepBtn.hidden = !hasScript || !clips.length;
    el.clearBtn.textContent = hasScript ? (clips.length ? 'Clear script and takes' : 'Clear script') : 'Clear takes';
    sheetReturn = document.activeElement;
    el.sheetBack.hidden = false;
    (el.keepBtn.hidden ? el.clearBtn : el.keepBtn).focus();
  }

  function closeSheet() {
    el.sheetBack.hidden = true;
    if (sheetReturn && sheetReturn.focus) sheetReturn.focus();
  }

  function resetSession(keepScript) {
    stopPlayback();
    emptyTrash();
    clips.forEach((c) => URL.revokeObjectURL(c.url));
    clips.length = 0;
    hueIndex = 0;
    unsaved = false;
    if (!keepScript) {
      el.ta.value = '';
      el.ta.scrollTop = 0;
      syncEmpty();
      keepScript_();
    }
    setStatus(keepScript ? 'Takes cleared. Your script is still here.' : 'Fresh start.');
    render();
  }

  el.newBtn.addEventListener('click', openSheet);
  el.keepBtn.addEventListener('click', () => { closeSheet(); resetSession(true); });
  el.clearBtn.addEventListener('click', () => { closeSheet(); resetSession(false); });
  el.cancelBtn.addEventListener('click', closeSheet);
  el.sheetBack.addEventListener('click', (e) => { if (e.target === el.sheetBack) closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !el.sheetBack.hidden) closeSheet(); });

  /* ---------- script card ---------- */
  const ta = el.ta;
  const syncEmpty = () => {
    const empty = ta.value.length === 0;
    el.box.classList.toggle('empty', empty);
    el.hint.hidden = empty || document.body.classList.contains('editing');
  };
  const keepScript_ = () => { try { localStorage.setItem('vo-script', ta.value); } catch (err) {} };

  try { const saved = localStorage.getItem('vo-script'); if (saved) ta.value = saved; } catch (err) {}
  syncEmpty();
  ta.addEventListener('input', () => { syncEmpty(); keepScript_(); });

  // Edit mode while the keyboard is up, read mode otherwise
  let baseH = 0, keyboardSeen = false;
  const vv = window.visualViewport;
  ta.addEventListener('focus', () => {
    if (ta.readOnly) return;
    document.body.classList.add('editing');
    el.done.hidden = false;
    el.hint.hidden = true;
    baseH = vv ? vv.height : window.innerHeight;
    keyboardSeen = false;
  });
  ta.addEventListener('blur', () => {
    document.body.classList.remove('editing');
    el.done.hidden = true;
    syncEmpty();
    keepScript_();
  });
  el.done.addEventListener('click', () => ta.blur());

  // The keyboard's Done key ends editing
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); }
  });
  ta.addEventListener('beforeinput', (e) => {
    if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') { e.preventDefault(); ta.blur(); }
  });

  // Closing the keyboard with the back gesture also ends editing
  if (vv) vv.addEventListener('resize', () => {
    if (document.activeElement !== ta || ta.readOnly) return;
    if (vv.height < baseH - 120) keyboardSeen = true;
    else if (keyboardSeen && vv.height > baseH - 60) ta.blur();
  });

  // Pinch the script to resize its text
  const MIN_SIZE = 14, MAX_SIZE = 40;
  let scriptSize = 19, pinch = null, pillTimer = 0;
  try { const s = parseFloat(localStorage.getItem('vo-size')); if (s >= MIN_SIZE && s <= MAX_SIZE) scriptSize = s; } catch (err) {}

  function setScriptSize(size, showPill) {
    const ratio = ta.scrollHeight > ta.clientHeight ? ta.scrollTop / (ta.scrollHeight - ta.clientHeight) : 0;
    scriptSize = clamp(size, MIN_SIZE, MAX_SIZE);
    document.documentElement.style.setProperty('--script-size', scriptSize.toFixed(1) + 'px');
    ta.scrollTop = ratio * (ta.scrollHeight - ta.clientHeight);
    if (showPill) {
      el.sizePill.textContent = 'Text ' + Math.round(scriptSize);
      el.sizePill.classList.add('show');
      clearTimeout(pillTimer);
      pillTimer = setTimeout(() => el.sizePill.classList.remove('show'), 900);
    }
  }
  const storeSize = () => { try { localStorage.setItem('vo-size', String(Math.round(scriptSize * 10) / 10)); } catch (err) {} };
  setScriptSize(scriptSize, false);

  const gap = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  el.box.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinch = { d: gap(e.touches), size: scriptSize };
      tapCount = 0;
    }
  }, { passive: true });
  el.box.addEventListener('touchmove', (e) => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    setScriptSize(pinch.size * gap(e.touches) / pinch.d, true);
  }, { passive: false });
  el.box.addEventListener('touchend', (e) => {
    if (pinch && e.touches.length < 2) { pinch = null; storeSize(); }
  });
  // iPhone Safari zooms the whole page on a pinch unless told not to
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  // Ctrl + mouse wheel does the same on a computer
  el.box.addEventListener('wheel', (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    setScriptSize(scriptSize * (1 - e.deltaY * 0.002), true);
    storeSize();
  }, { passive: false });

  // Multi-tap selection: 2 taps = word, 3 = paragraph, 4 = whole script
  const isWordChar = (ch) => /[\p{L}\p{N}\p{M}'’]/u.test(ch);
  let downT = 0, downX = 0, downY = 0, pointers = 0;
  let tapCount = 0, lastT = 0, lastX = 0, lastY = 0, anchor = 0;

  function wordAt(v, pos) {
    let p = Math.min(pos, v.length);
    if (!isWordChar(v[p] || '') && p > 0 && isWordChar(v[p - 1])) p--;
    if (!isWordChar(v[p] || '')) return null;
    let s = p, e = p;
    while (s > 0 && isWordChar(v[s - 1])) s--;
    while (e < v.length && isWordChar(v[e])) e++;
    return [s, e];
  }

  function paragraphAt(v, pos) {
    const re = /\n[ \t]*\n/g;
    let s = 0, e = v.length, m;
    while ((m = re.exec(v))) {
      const a = m.index, b = a + m[0].length;
      if (b <= pos) s = b;
      else if (a >= pos) { e = a; break; }
      else s = b;
    }
    while (s < e && /\s/.test(v[s])) s++;
    while (e > s && /\s/.test(v[e - 1])) e--;
    return s < e ? [s, e] : null;
  }

  function selectFor(n) {
    const v = ta.value;
    if (!v) return;
    const range = n === 2 ? wordAt(v, anchor) : n === 3 ? paragraphAt(v, anchor) : [0, v.length];
    if (!range) return;
    if (document.activeElement !== ta) ta.focus({ preventScroll: true });
    ta.setSelectionRange(range[0], range[1]);
  }

  ta.addEventListener('pointerdown', (e) => {
    pointers++;
    if (pointers > 1 || !e.isPrimary) { tapCount = 0; return; }
    downT = performance.now(); downX = e.clientX; downY = e.clientY;
  });
  const pointerGone = () => { pointers = Math.max(0, pointers - 1); };
  ta.addEventListener('pointercancel', () => { pointerGone(); tapCount = 0; });
  ta.addEventListener('pointerup', (e) => {
    const multi = pointers > 1 || !e.isPrimary || pinch;
    pointerGone();
    if (multi) { tapCount = 0; return; }
    const now = performance.now();
    if (now - downT > 500 || Math.hypot(e.clientX - downX, e.clientY - downY) > 12) { tapCount = 0; return; }
    const near = Math.hypot(e.clientX - lastX, e.clientY - lastY) < 40;
    tapCount = (now - lastT < 450 && near) ? tapCount + 1 : 1;
    lastT = now; lastX = e.clientX; lastY = e.clientY;
    if (tapCount === 1) {
      setTimeout(() => { anchor = ta.selectionStart; }, 60);
    } else {
      const n = Math.min(tapCount, 4);
      setTimeout(() => selectFor(n), 90);
    }
  });

  /* ---------- live level meter and timer ---------- */
  const history = [];
  let frame = 0;
  let colors = null;
  const readColors = () => {
    const s = getComputedStyle(document.documentElement);
    colors = { rec: s.getPropertyValue('--rec').trim(), idle: s.getPropertyValue('--line').trim() };
  };
  readColors();
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readColors);
  }

  function tick() {
    requestAnimationFrame(tick);
    if (recording) el.timer.textContent = clockTenths((performance.now() - recStart) / 1000);
    if (playingId !== null && !player.paused) paintProgress();

    const cv = el.meter, dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    let level = 0;
    if (analyser && stream && stream.active) {
      analyser.getFloatTimeDomainData(levelData);
      for (let i = 0; i < levelData.length; i++) { const v = Math.abs(levelData[i]); if (v > level) level = v; }
      level = Math.min(1, level * 1.6);
    }
    if (++frame % 3 === 0) { history.push(level); if (history.length > 400) history.shift(); }

    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    g.fillStyle = recording ? colors.rec : colors.idle;
    const step = 5, count = Math.floor(w / step);
    for (let i = 0; i < count; i++) {
      const v = history[history.length - 1 - i] || 0;
      const bh = Math.max(3, v * (h - 4));
      const x = w - (i + 1) * step + 1;
      const y = (h - bh) / 2;
      if (g.roundRect) { g.beginPath(); g.roundRect(x, y, 3, bh, 1.5); g.fill(); }
      else g.fillRect(x, y, 3, bh);
    }
  }
  requestAnimationFrame(tick);

  // Keep the undo toast just above the dock
  const syncDock = () => document.documentElement.style.setProperty('--dock-h', el.dock.offsetHeight + 'px');
  if (window.ResizeObserver) new ResizeObserver(syncDock).observe(el.dock);
  syncDock();

  /* ---------- wiring ---------- */
  el.rec.addEventListener('click', onRecTap);
  el.statusBtn.addEventListener('click', () => { setMode('phone'); el.statusBtn.hidden = true; });
  el.capture.addEventListener('change', () => {
    const file = el.capture.files && el.capture.files[0];
    if (file) addClip(file);
  });
  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' || !el.sheetBack.hidden) return;
    const tag = e.target && e.target.tagName;
    if (tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'INPUT') return;
    e.preventDefault();
    onRecTap();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !recording) releaseStream();
  });
  window.addEventListener('beforeunload', (e) => {
    if (clips.length || recording) { e.preventDefault(); e.returnValue = ''; }
  });

  window.__voHasClips = () => clips.length > 0 || recording;

  if (!micPossible) setMode('phone');
  render();
})();
</script>
</body>
</html>
